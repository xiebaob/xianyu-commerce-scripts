name: Daily GitHub 趋势信号

on:
  schedule:
    - cron: '0 1 * * *'          # 每天 09:00 北京时间 (UTC 01:00)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 抓取当日 GitHub 趋势并落盘
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 提升 Search API 限额
        run: |
          mkdir -p trends
          python github_trending.py > "trends/$(date +%Y-%m-%d).md"
      - name: 提交趋势快照
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: daily trend $(date +%Y-%m-%d)" || echo "no changes"
          git push
