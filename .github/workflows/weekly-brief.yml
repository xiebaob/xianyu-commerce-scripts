name: Weekly 选品简报

on:
  schedule:
    - cron: '30 1 * * 1'         # 每周一 09:30 北京时间 (UTC 01:30)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 跑评分器 + 生成周简报
        run: |
          mkdir -p briefs
          if [ -f candidates.json ]; then
            echo "使用真实候选 candidates.json"
            python selection_scorer.py candidates.json --out ranked.json
            python selection_brief.py --input candidates.json --out "briefs/$(date +%Y-%m-%d).md"
          else
            echo "::warning::未找到 candidates.json，回落到内置样例（仅演示，非真实结论）"
            python selection_scorer.py --out ranked.json
            python selection_brief.py --out "briefs/$(date +%Y-%m-%d).md"
          fi
      - name: 提交本周简报
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: weekly brief $(date +%Y-%m-%d)" || echo "no changes"
          git push
